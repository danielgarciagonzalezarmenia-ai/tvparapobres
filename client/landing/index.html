  <style>
    :root {
      --bg: #000;
      --panel: #141517;
      --panel-2: #191b1e;
      --panel-3: #212629;
      --line-soft: rgba(255,255,255,0.06);
      --text: #f0f0f0;
      --muted: #a1a4a5;
      --accent: #ff4d2e;
      --accent-strong: #ff8a66;
      --green: #66d9a8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
      background:radial-gradient(1000px 520px at 50% -8%,rgba(255,77,46,0.13),transparent 62%),var(--bg);
      color:var(--text);-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;min-height:100vh;
    }

    header{
      display:flex;align-items:center;gap:20px;
      padding:12px 24px;
      background:rgba(6,6,8,0.82);backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line-soft);flex-shrink:0;
    }
    .brand{font-weight:800;letter-spacing:0.16em;font-size:0.9rem;color:var(--text);display:flex;align-items:center;gap:10px;white-space:nowrap}
    .brand-dot{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent-strong),var(--accent));box-shadow:0 0 14px var(--accent)}

    .hero{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:4rem 2rem 2rem;text-align:center;gap:1.5rem;
    }
    .hero h1{
      font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:0.08em;
      background:linear-gradient(135deg,var(--accent-strong),var(--accent));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .hero p{font-size:1.05rem;color:var(--muted);max-width:460px;line-height:1.6}

    .features{
      display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem;
    }
    .feat{
      display:flex;align-items:center;gap:6px;
      background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
      padding:8px 16px;font-size:.85rem;color:var(--muted);
    }
    .feat .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .feat .dot.red{background:var(--accent)}
    .feat .dot.green{background:var(--green)}

    .downloads{
      display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1.5rem;
    }
    .btn{
      display:flex;align-items:center;gap:10px;
      padding:14px 28px;border-radius:14px;font-size:.95rem;font-weight:600;
      text-decoration:none;transition:all .25s;cursor:pointer;border:none;
      background:var(--panel-2);border:1px solid var(--line-soft);color:var(--text);
    }
    .btn:hover{
      border-color:var(--accent);box-shadow:0 0 30px rgba(255,77,46,0.15);
      transform:translateY(-2px);
    }
    .btn svg{width:20px;height:20px;fill:currentColor;opacity:.7}
    .btn-label{font-size:.7rem;color:var(--muted);font-weight:400;margin-left:4px}
    .ver{margin-top:1.1rem;font-size:.75rem;color:var(--muted);letter-spacing:.04em}

    footer{
      text-align:center;padding:1.5rem;font-size:.8rem;color:var(--muted);
      border-top:1px solid var(--line-soft);
    }

    @media(max-width:520px){
      .hero{padding:3rem 1.5rem 1.5rem}
      .downloads{flex-direction:column;align-items:center}
      .btn{width:100%;max-width:280px;justify-content:center}
    }
  </style>
</head>
